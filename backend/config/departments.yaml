departments:
  - id: "GEN_MED"
    name: "General Medicine"
    description: "Primary evaluation for general symptoms, fever, fatigue, headaches, and routine adult health concerns."
    keywords:
      - "fever"
      - "fatigue"
      - "cold"
      - "flu"
      - "cough"
      - "headache"
      - "general checkup"
      - "body ache"
      - "weakness"

  - id: "ORTHO"
    name: "Orthopaedics"
    description: "Evaluation and care for bone, joint, muscle, ligament, and spine-related concerns."
    keywords:
      - "knee pain"
      - "back pain"
      - "joint pain"
      - "fracture"
      - "sprain"
      - "shoulder pain"
      - "ankle"
      - "stiffness"
      - "swollen joint"

  - id: "ENT"
    name: "Ear, Nose & Throat"
    description: "Specialist evaluation for ear, sinus, nasal, throat, hearing, and balance concerns."
    keywords:
      - "ear ache"
      - "ear pain"
      - "ringing"
      - "tinnitus"
      - "sore throat"
      - "sinus"
      - "nasal congestion"
      - "hearing loss"
      - "hoarseness"

  - id: "DERM"
    name: "Dermatology"
    description: "Care for skin rashes, itching, lesions, acne, eczema, and nail or hair concerns."
    keywords:
      - "rash"
      - "itching"
      - "skin"
      - "acne"
      - "eczema"
      - "hives"
      - "mole"
      - "dry skin"
      - "psoriasis"

  - id: "OPHTH"
    name: "Ophthalmology"
    description: "Eye care for vision changes, eye irritation, redness, dryness, and routine eye exams."
    keywords:
      - "blurry vision"
      - "eye pain"
      - "red eye"
      - "itchy eyes"
      - "dry eyes"
      - "vision"
      - "eye strain"
      - "watery eyes"

  - id: "CARDIO"
    name: "Cardiology"
    description: "Non-emergency cardiology consultations for blood pressure follow-ups, palpitations, and cholesterol management."
    keywords:
      - "blood pressure"
      - "hypertension"
      - "palpitations"
      - "heart checkup"
      - "cholesterol"
      - "cardiac follow-up"
      - "irregular heartbeat"